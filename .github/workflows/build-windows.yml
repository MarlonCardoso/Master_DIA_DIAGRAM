name: Build Dia Windows (.exe)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar MSYS2 no GitHub
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-gtk3
          mingw-w64-ucrt-x86_64-graphene
          mingw-w64-ucrt-x86_64-meson
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-libxml2

    - name: Remover subprojeto quebrado
      shell: msys2 {0}
      run: |
        # Remove a pasta vazia do subprojeto para o Meson não tentar ler um diretório incompleto
        rm -rf dia-master/subprojects/xpm-pixbuf
        # Altera o meson.build para tornar a dependência xpm-pixbuf opcional/desativada
        sed -i "s/dependency('xpm-pixbuf'/dependency('xpm-pixbuf', required: false/g" dia-master/meson.build

    - name: Compilar o Dia
      shell: msys2 {0}
      run: |
        cd dia-master
        rm -rf build-win
        meson setup build-win --wrap-mode=nodownload
        ninja -C build-win

    - name: Empacotar para Windows 11 (Portátil com DLLs)
      shell: msys2 {0}
      run: |
        cd dia-master/build-win/app
        # Copia as DLLs do ambiente UCRT64 para o executável rodar de forma independente
        cp /ucrt64/bin/*.dll . 2>/dev/null || true
        zip -r dia-windows.zip .

    - name: Disponibilizar para Download
      uses: actions/upload-artifact@v4
      with:
        name: Dia-Windows-Exe
        path: dia-master/build-win/app/dia-windows.zip
