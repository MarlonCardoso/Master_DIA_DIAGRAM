name: Build Dia Windows (.exe)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Criar subprojeto xpm-pixbuf localmente
      shell: bash
      run: |
        mkdir -p dia-master/subprojects/xpm-pixbuf
        
        # Cria o meson.build do subprojeto
        cat << 'EOF' > dia-master/subprojects/xpm-pixbuf/meson.build
        project('xpm-pixbuf', 'c')
        xpm_sources = ['xpm-pixbuf.c']
        xpm_dep = declare_dependency(
          include_directories : include_directories('.'),
          sources : xpm_sources
        )
        EOF

        # Cria o cabeçalho xpm-pixbuf.h
        cat << 'EOF' > dia-master/subprojects/xpm-pixbuf/xpm-pixbuf.h
        #ifndef XPM_PIXBUF_H
        #define XPM_PIXBUF_H
        #include <gdk-pixbuf/gdk-pixbuf.h>
        G_BEGIN_DECLS
        GdkPixbuf *xpm_pixbuf_load_from_data(const gchar *data[]);
        G_END_DECLS
        #endif
        EOF

        # Cria a implementação xpm-pixbuf.c
        cat << 'EOF' > dia-master/subprojects/xpm-pixbuf/xpm-pixbuf.c
        #include "xpm-pixbuf.h"
        GdkPixbuf *xpm_pixbuf_load_from_data(const gchar *data[]) {
            return gdk_pixbuf_new_from_xpm_data(data);
        }
        EOF

    - name: Configurar MSYS2 no GitHub
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-gtk3
          mingw-w64-ucrt-x86_64-graphene
          mingw-w64-ucrt-x86_64-appstream
          mingw-w64-ucrt-x86_64-meson
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-libxml2
          diffutils

    - name: Compilar o Dia
      shell: msys2 {0}
      run: |
        cd dia-master
        rm -rf build-win
        meson setup build-win -Dtests=false --wrap-mode=nodownload
        ninja -C build-win

    - name: Empacotar para Windows 11 (Portátil com DLLs)
      shell: msys2 {0}
      run: |
        cd dia-master/build-win/app
        cp /ucrt64/bin/*.dll . 2>/dev/null || true
        zip -r dia-windows.zip .

    - name: Disponibilizar para Download
      uses: actions/upload-artifact@v4
      with:
        name: Dia-Windows-Exe
        path: dia-master/build-win/app/dia-windows.zip
