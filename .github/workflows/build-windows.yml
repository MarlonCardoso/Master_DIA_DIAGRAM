name: Build Dia Windows (.exe)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Baixar o subprojeto xpm-pixbuf ausente
      shell: bash
      run: |
        git clone https://gitlab.gnome.org/GNOME/dia.git temp-dia || true
        # Se preferir clonar direto o subprojeto xpm-pixbuf se houver repositório público, ou clonar via git submodule se configurado:
        mkdir -p dia-master/subprojects/xpm-pixbuf
        # Alternativa robusta: baixar o arquivo xpm-pixbuf necessário ou clonar o repositório oficial do subprojeto
        curl -L https://gitlab.gnome.org/GNOME/dia/-/raw/master/subprojects/xpm-pixbuf/xpm-pixbuf.h -o dia-master/subprojects/xpm-pixbuf/xpm-pixbuf.h --create-dirs || true
        curl -L https://gitlab.gnome.org/GNOME/dia/-/raw/master/subprojects/xpm-pixbuf/meson.build -o dia-master/subprojects/xpm-pixbuf/meson.build || true

    - name: Configurar MSYS2 no GitHub
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-gtk3
          mingw-w64-ucrt-x86_64-graphene
          mingw-w64-ucrt-x86_64-appstream
          mingw-w64-ucrt-x86_64-meson
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-libxml2
          diffutils

    - name: Compilar o Dia
      shell: msys2 {0}
      run: |
        cd dia-master
        rm -rf build-win
        meson setup build-win -Dtests=false --wrap-mode=nodownload
        ninja -C build-win

    - name: Empacotar para Windows 11 (Portátil com DLLs)
      shell: msys2 {0}
      run: |
        cd dia-master/build-win/app
        cp /ucrt64/bin/*.dll . 2>/dev/null || true
        zip -r dia-windows.zip .

    - name: Disponibilizar para Download
      uses: actions/upload-artifact@v4
      with:
        name: Dia-Windows-Exe
        path: dia-master/build-win/app/dia-windows.zip
