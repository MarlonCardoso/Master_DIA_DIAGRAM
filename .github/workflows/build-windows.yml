name: Build Dia Windows (.exe)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configurar MSYS2 e Dependências
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-graphene
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libxslt
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-pango
            mingw-w64-x86_64-gsl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-appstream
            mingw-w64-x86_64-desktop-file-utils

      - name: Configurar Meson
        shell: msys2 {0}
        run: |
          export CFLAGS="-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=deprecated-declarations"
          export CXXFLAGS="$CFLAGS"

          if [ -f dia-master/build-aux/windows-bundler.sh ]; then
            printf '#!/bin/sh\nexit 0\n' > dia-master/build-aux/windows-bundler.sh
            chmod +x dia-master/build-aux/windows-bundler.sh
          fi

          meson setup builddir dia-master \
            --buildtype=release \
            -Dc_link_args="-Wl,--export-all-symbols -Wl,--enable-auto-import" \
            -Dcpp_link_args="-Wl,--export-all-symbols -Wl,--enable-auto-import" \
            -Ddoc=false

      - name: Compilar Dia
        shell: msys2 {0}
        run: |
          meson compile -C builddir || meson compile -C builddir -j 1

      - name: Instalar e Copiar Dependências
        shell: msys2 {0}
        run: |
          meson install -C builddir --destdir output

          BIN_DIR=$(find output -type f -name "dia.exe" -exec dirname {} \;)
          PREFIX_DIR=$(dirname "$BIN_DIR")

          cp -u /mingw64/bin/*.dll "$BIN_DIR/" 2>/dev/null || true
          cp -ru /mingw64/share "$PREFIX_DIR/" 2>/dev/null || true
          cp -ru /mingw64/lib "$PREFIX_DIR/" 2>/dev/null || true
          cp -ru /mingw64/etc "$PREFIX_DIR/" 2>/dev/null || true

      - name: Upload do Artefato do Build
        uses: actions/upload-artifact@v4
        with:
          name: Dia-Windows-x64-Build
          path: builddir/output/
