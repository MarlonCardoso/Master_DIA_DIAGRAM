name: Build Dia Windows (.exe)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libxslt
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-poppler
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-pango
            mingw-w64-x86_64-gsl
            mingw-w64-x86_64-zlib

      - name: Configure Meson
        shell: msys2 {0}
        run: |
          # Disable strict GCC checks for legacy C code compatibility
          export CFLAGS="-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=deprecated-declarations"
          export CXXFLAGS="$CFLAGS"

          # Configure Meson without requiring XSPLT docbook tools
          meson setup builddir --buildtype=release -Ddoc=false

      - name: Compile Dia
        shell: msys2 {0}
        run: |
          # Try parallel build first; fallback to single-thread (-j 1) on failure to print clear error
          meson compile -C builddir || meson compile -C builddir -j 1

      - name: Install to Staging Directory
        shell: msys2 {0}
        run: |
          meson install -C builddir --destdir output

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dia-Windows-x64-Build
          path: builddir/output/
